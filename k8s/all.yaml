apiVersion: v1
kind: Namespace
metadata:
  name: llm-logger
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-logger-secrets
  namespace: llm-logger
type: Opaque
stringData:
  groq-api-key: "gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  gemini-api-key: "AIxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  postgres-password: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-logger-config
  namespace: llm-logger
data:
  database-url: "postgresql+asyncpg://postgres:postgres@postgres:5432/llm_logger"
  redis-url: "redis://redis:6379"
  app-env: "production"
  log-level: "INFO"
  cors-origins: "*"
  groq-model: "llama-3.3-70b-versatile"
  gemini-model: "gemini-2.0-flash"
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: llm-logger}
spec:
  ports: [{port: 5432}]
  selector: {app: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: llm-logger}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - {name: POSTGRES_DB, value: llm_logger}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: postgres-password}}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: postgres-data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "postgres"]}, initialDelaySeconds: 5, periodSeconds: 5}
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 10Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: llm-logger}
spec:
  ports: [{port: 6379}]
  selector: {app: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: llm-logger}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: llm-logger}
spec:
  ports: [{port: 8000}]
  selector: {app: backend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: llm-logger}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      initContainers:
        - name: alembic-migration
          image: llm-logger-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom: [{configMapRef: {name: llm-logger-config}}]
          env:
            - {name: GROQ_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: groq-api-key}}}
            - {name: GEMINI_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: gemini-api-key}}}
      containers:
        - name: backend
          image: llm-logger-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom: [{configMapRef: {name: llm-logger-config}}]
          env:
            - {name: GROQ_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: groq-api-key}}}
            - {name: GEMINI_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: gemini-api-key}}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {requests: {memory: "256Mi", cpu: "250m"}, limits: {memory: "512Mi", cpu: "500m"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: llm-logger}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: llm-logger-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.ingestion.worker"]
          envFrom: [{configMapRef: {name: llm-logger-config}}]
          env:
            - {name: GROQ_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: groq-api-key}}}
            - {name: GEMINI_API_KEY, valueFrom: {secretKeyRef: {name: llm-logger-secrets, key: gemini-api-key}}}
          resources: {requests: {memory: "128Mi", cpu: "100m"}, limits: {memory: "256Mi", cpu: "250m"}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: llm-logger}
spec:
  ports: [{port: 3000}]
  selector: {app: frontend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: llm-logger}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: llm-logger-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          env: [{name: VITE_API_URL, value: "http://backend:8000"}]
          readinessProbe: {httpGet: {path: /, port: 3000}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {memory: "128Mi", cpu: "100m"}, limits: {memory: "256Mi", cpu: "250m"}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-logger-ingress
  namespace: llm-logger
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: llm-logger.local
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 3000}}}}
